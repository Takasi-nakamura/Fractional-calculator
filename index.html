<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>分数計算機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">分数計算機</h1>
    </header>

    <main class="layout">
      <div class="stack">
        <section class="card">
          <div class="label">入力</div>
          <div class="editor" id="editor"></div>
          <div class="tools">
            <button class="pill" id="removeBtn" type="button">直前の項を削除</button>
          </div>
        </section>

        <section class="card formula-card" id="formulaCard" tabindex="0" role="button" aria-haspopup="listbox">
          <div class="formula-meta">
            <span class="label">計算式 ・ タップで切替</span>
            <span class="chip" id="modeLabel">約分</span>
          </div>
          <div class="formula" id="formula"></div>
        </section>
      </div>

      <aside class="card keypad-card">
        <div class="keypad-label" id="keypadLabel">選択中</div>
        <div class="keypad">
          <button class="key" data-key="7" type="button">7</button>
          <button class="key" data-key="8" type="button">8</button>
          <button class="key" data-key="9" type="button">9</button>
          <button class="key" data-key="4" type="button">4</button>
          <button class="key" data-key="5" type="button">5</button>
          <button class="key" data-key="6" type="button">6</button>
          <button class="key" data-key="1" type="button">1</button>
          <button class="key" data-key="2" type="button">2</button>
          <button class="key" data-key="3" type="button">3</button>
          <button class="key fn" data-key="C" type="button">C</button>
          <button class="key" data-key="0" type="button">0</button>
          <button class="key fn" data-key="BS" type="button" aria-label="一文字削除">⌫</button>
        </div>
        <button class="key-next" data-key="NEXT" type="button">次へ →</button>
      </aside>
    </main>
  </div>

  <div class="dropdown" id="dropdown" role="listbox" hidden></div>

  <script src="script.js"></script>
</body>
</html>
